<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Interactive Page</title>
    <style>
        body {
            background-color: pink;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: red;
        }
        .heart {
            color: red;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <p>Send love and joy to everyone!</p>
    <div class="heart">❤️</div>
    <script>
        // Simple interactive feature to change heart color on click
        const heart = document.querySelector('.heart');
        heart.addEventListener('click', () => {
            heart.style.color = '#' + Math.floor(Math.random()*16777215).toString(16);
        });
    </script>
</body>
</html>
